<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; }
  body {
    width: 290px;
    font-family: system-ui, -apple-system, sans-serif;
    background: #16181f;
    color: #e2e6ee;
    margin: 0;
  }
  .hd {
    background: #4f46e5;
    padding: 16px 18px;
    font-size: 16px;
    font-weight: 800;
  }
  .bd { padding: 16px; }
  .status-box {
    background: #1f2330;
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
    font-weight: 600;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #a6e3a1; flex-shrink: 0; }
  .dot.off { background: #ef4444; }

  .auth-box {
    background: #1f2330;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .auth-box h4 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #a78bfa;
    margin: 0 0 10px;
  }
  input {
    width: 100%;
    background: #0f1117;
    border: 1px solid #2a2f3d;
    color: #e2e6ee;
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 12.5px;
    margin-bottom: 8px;
  }
  input:focus { outline: none; border-color: #4f46e5; }
  button.auth-btn {
    width: 100%;
    background: #4f46e5;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 9px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
  }
  button.auth-btn:hover { background: #4338ca; }
  button.logout-btn {
    width: 100%;
    background: #2a2f3d;
    color: #e2e6ee;
    border: none;
    border-radius: 8px;
    padding: 9px;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .logged-in-as {
    font-size: 12px;
    color: #a6e3a1;
    margin-bottom: 8px;
    text-align: center;
  }
  .auth-error {
    color: #fca5a5;
    font-size: 11px;
    margin-bottom: 8px;
  }

  .info-box {
    background: #1f2330;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 11.5px;
    line-height: 1.7;
    color: #a8b0c2;
  }
  .info-box a { color: #818cf8; text-decoration: none; font-weight: 600; }
  .info-box a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="hd">🧠 PromptIQ</div>
  <div class="bd">
    <div class="status-box">
      <div class="dot" id="dot"></div>
      <span id="status-text">Checking backend…</span>
    </div>

    <div class="auth-box" id="auth-box">
      <!-- Filled dynamically by popup.js: either a login form
           or a "logged in as X" + logout button -->
    </div>

    <div class="info-box">
      Go to <a href="https://chatgpt.com" target="_blank">ChatGPT</a>,
      <a href="https://claude.ai" target="_blank">Claude</a>, or
      <a href="https://gemini.google.com" target="_blank">Gemini</a>,
      type a prompt, click the floating <strong>🧠 Analyze</strong> button.
      Log in above to unlock <strong>Optimize</strong>.
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
